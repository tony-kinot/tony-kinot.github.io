<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>読み終えた方へ 3つの質問</title>

<script>

function gtag(){dataLayer.push(arguments);}

<style>
  body{font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;max-width:40rem;margin:3rem auto;padding:0 1rem;line-height:1.8;color:#222;background:#fff}
  h1{font-size:1.3rem}
  fieldset{border:1px solid #ccc;border-radius:6px;margin:1.2rem 0;padding:.8rem 1rem}
  legend{font-weight:600;padding:0 .4rem}
  label{display:block;margin:.3rem 0}
  textarea{width:100%;box-sizing:border-box;font:inherit;padding:.5rem}
  button{font:inherit;padding:.6rem 1.4rem;border:0;border-radius:6px;background:#1a5fb4;color:#fff}
  small{color:#555}
</style>
</head>
<body>
<h1>『AIエージェントに仕事を任せる前に知っておきたい、実際に起きた事故と防ぎ方』を読み終えた方へ</h1>
<p>名前もメールアドレスも聞きません。3つだけ教えてください。答えなくても本は最後まで読めます。返事は約束できませんが、次の版と次の本に反映します。</p>
<form method="get" action="done/">
<fieldset>
<legend>1. この本をどこで知りましたか</legend>
<label><input type="radio" name="q1" value="amazon" required> Amazon の検索</label>
<label><input type="radio" name="q1" value="zenn"> Zenn の記事</label>
<label><input type="radio" name="q1" value="note"> note の記事</label>
<label><input type="radio" name="q1" value="x"> X の投稿</label>
<label><input type="radio" name="q1" value="person"> 人から聞いた</label>
<label><input type="radio" name="q1" value="other"> その他</label>
</fieldset>
<fieldset>
<legend>2. いちばん役に立った章はどれですか</legend>
<label><input type="radio" name="q2" value="ch1" required> 第1章 送る前の失敗と送ったあとの失敗を分ける</label>
<label><input type="radio" name="q2" value="ch2"> 第2章 エージェントごとに作業の場所を分ける</label>
<label><input type="radio" name="q2" value="ch3"> 第3章 依頼文の「やらないこと」欄</label>
<label><input type="radio" name="q2" value="ch4"> 第4章 空の設定を失敗にする</label>
<label><input type="radio" name="q2" value="ch5"> 第5章 採点を足切りに下げる</label>
<label><input type="radio" name="q2" value="ch6"> 第6章 方針を作業前に読ませ、承認の依頼を差し戻す</label>
<label><input type="radio" name="q2" value="ch7"> 第7章 決まりは1か所に書き、形で見られる物は検査へ</label>
<label><input type="radio" name="q2" value="outro"> おわりに 最初に入れる3つ</label>
<label><input type="radio" name="q2" value="none"> 役に立った章は無かった</label>
</fieldset>
<fieldset>
<legend>3. 次に読みたい物は何ですか</legend>
<textarea name="q3" rows="3" maxlength="200" placeholder="200字まで。名前や連絡先は書かないでください"></textarea>
</fieldset>
<p><button type="submit">送る</button></p>
</form>
<p><small>送った答えは、ブラウザの種類などの接続情報とともに Google アナリティクス（Google LLC）へ送られ、著者が集計にだけ使います。IP アドレスは短くして記録します。</small></p>
</body>
</html>
