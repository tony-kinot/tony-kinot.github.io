<title>Amazon の本のページへ移動します</title>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-0Z38XKSNY5"></script>
<script>
// 置き場所（案）: tony-kinot.github.io/kdp-book1/go/index.html
// 使い方: https://tony-kinot.github.io/kdp-book1/go/?from=qiita のように from を付けて貼る。
// from は決めた語だけを通し、それ以外は other にする（URL に余計な文字を持ち込ませない）。
var DEST = 'https://www.amazon.co.jp/dp/B0HQF3J9TF';
var ALLOWED = ['zenn', 'qiita', 'booth', 'zennbook', 'advent', 'github', 'other'];
var from = (new URLSearchParams(location.search).get('from') || 'other').toLowerCase();
if (ALLOWED.indexOf(from) < 0) { from = 'other'; }
var moved = false;
function go() { if (!moved) { moved = true; location.replace(DEST); } }
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-0Z38XKSNY5', {anonymize_ip: true, send_page_view: false});
gtag('event', 'book_link_click', {link_from: from, event_callback: go, event_timeout: 800});
// 計測が止められている環境でも必ず移動する
setTimeout(go, 900);
</script>
